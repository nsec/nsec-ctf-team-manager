services:
  team-manager:
    image: ghcr.io/nsec/nsec-ctf-team-manager:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - team-manager-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

volumes:
  team-manager-data:
