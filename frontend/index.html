<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- XSS hardening: no inline scripts/styles, no external script origins,
       no eval. connect-src 'self' allows API calls to the same origin only.
       font-src/style-src include fonts.gstatic.com/fonts.googleapis.com for
       the Roboto webfont (same as nsec.io). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
  <title>NSEC Team Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>NSEC Team Manager</h1>
    <div class="language-control">
      <button id="language-toggle" class="language-toggle" type="button"
              aria-label="Switch to French">
        <span id="language-toggle-label">EN</span>
      </button>
    </div>
  </header>

  <main>
    <section id="message" class="message hidden" aria-live="polite"></section>

    <!-- Landing: choose an action -->
    <section id="landing" class="card">
      <h2 data-i18n="landing.title">Welcome!</h2>
      <p data-i18n="landing.prompt">What would you like to do?</p>
      <div class="actions">
        <button id="btn-show-create" class="btn primary" data-i18n="action.createTeam">Create a team</button>
        <button id="btn-show-join" class="btn" data-i18n="action.joinTeam">Join a team</button>
        <button id="btn-show-verify" class="btn" data-i18n="action.verifyMembers">Verify team members</button>
      </div>
    </section>

    <!-- Create team -->
    <section id="create-team" class="card hidden">
      <h2 data-i18n="create.title">Create a team</h2>
      <form id="create-form">
        <label for="create-name" data-i18n="form.teamName">Team name</label>
        <input
          type="text"
          id="create-name"
          name="teamName"
          data-i18n-placeholder="form.createNamePlaceholder"
          placeholder="e.g. Kernel Panic"
          maxlength="32"
          required
          autocomplete="off"
        />
        <p class="hint" data-i18n="create.maxLengthHint" data-i18n-max="maxTeamNameLength">Maximum length: 128 characters.</p>
        <label for="create-order-code" data-i18n="form.orderCode">Pretix order code</label>
        <input
          type="text"
          id="create-order-code"
          name="orderCode"
          data-i18n-placeholder="form.orderCodePlaceholder"
          placeholder="e.g. QHB8A"
          maxlength="64"
          required
          autocomplete="off"
        />
        <div class="actions">
          <button id="create-load-attendees" type="button" class="btn" data-i18n="action.findAttendees">Find attendees</button>
        </div>
        <label for="create-attendee-email" data-i18n="form.attendeeEmail">Attendee email</label>
        <select id="create-attendee-email" name="attendeeEmail" required disabled>
          <option value="" selected disabled data-i18n="order.selectAttendeePlaceholder">Enter an order code and find attendees</option>
        </select>
        <div class="actions">
          <button type="submit" class="btn primary" data-i18n="action.create">Create</button>
          <button type="button" class="btn" data-action="back" data-i18n="action.back">Back</button>
        </div>
      </form>
    </section>

    <!-- Join team -->
    <section id="join-team" class="card hidden">
      <h2 data-i18n="join.title">Join a team</h2>
      <form id="join-form">
        <label for="join-name" data-i18n="form.teamName">Team name</label>
        <select
          id="join-name"
          name="teamName"
          required
        >
          <option value="" selected disabled data-i18n="join.selectTeamPlaceholder">Select a team</option>
        </select>
        <label for="join-order-code" data-i18n="form.orderCode">Pretix order code</label>
        <input
          type="text"
          id="join-order-code"
          name="orderCode"
          data-i18n-placeholder="form.orderCodePlaceholder"
          placeholder="e.g. QHB8A"
          maxlength="64"
          required
          autocomplete="off"
        />
        <div class="actions">
          <button id="join-load-attendees" type="button" class="btn" data-i18n="action.findAttendees">Find attendees</button>
        </div>
        <label for="join-attendee-email" data-i18n="form.attendeeEmail">Attendee email</label>
        <select id="join-attendee-email" name="attendeeEmail" required disabled>
          <option value="" selected disabled data-i18n="order.selectAttendeePlaceholder">Enter an order code and find attendees</option>
        </select>
        <p class="hint" data-i18n="join.membersHint" data-i18n-max="maxMembersPerTeam">Teams can have up to 8 members.</p>
        <div class="actions">
          <button type="submit" class="btn primary" data-i18n="action.join">Join</button>
          <button type="button" class="btn" data-action="back" data-i18n="action.back">Back</button>
        </div>
      </form>
    </section>

    <!-- Verify existing team members -->
    <section id="verify-team" class="card hidden">
      <h2 data-i18n="verify.title">Verify team members</h2>
      <form id="verify-form">
        <label for="verify-name" data-i18n="form.teamName">Team name</label>
        <select id="verify-name" name="teamName" required>
          <option value="" selected disabled data-i18n="join.selectTeamPlaceholder">Select a team</option>
        </select>
        <label for="verify-order-code" data-i18n="form.orderCode">Pretix order code</label>
        <input
          type="text"
          id="verify-order-code"
          name="orderCode"
          data-i18n-placeholder="form.orderCodePlaceholder"
          placeholder="e.g. QHB8A"
          maxlength="64"
          required
          autocomplete="off"
        />
        <div class="actions">
          <button type="submit" class="btn primary" data-i18n="action.verify">Verify</button>
          <button type="button" class="btn" data-action="back" data-i18n="action.back">Back</button>
        </div>
      </form>
    </section>

    <!-- Team view -->
    <section id="team-view" class="card hidden">
      <h2><span data-i18n="team.titlePrefix">Team: </span><span id="team-view-name"></span></h2>
      <p id="team-view-role"></p>
      <h3><span data-i18n="team.members">Members</span> (<span id="member-count"></span>/<span data-config="maxMembersPerTeam"></span>)</h3>
      <ul id="member-list" class="member-list"></ul>
      <div class="actions">
        <button type="button" class="btn" data-action="back" data-i18n="action.back">Back</button>
      </div>
    </section>
  </main>

  <footer>
    <p><a href="https://github.com/nsec/nsec-ctf-team-manager" target="_blank" rel="noopener noreferrer" data-i18n="footer">Source code</a></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
